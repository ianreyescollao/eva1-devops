spring:
  application:
    name: msvc-ingrediente

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ingredientesdb
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  cloud:
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG