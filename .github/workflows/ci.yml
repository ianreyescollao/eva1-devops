name: CI - Workflow

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - main

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dar permisos a Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar, ejecutar pruebas y analizar con SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=ianreyescollao_eva1-devops -Dsonar.qualitygate.wait=${{ github.ref == 'refs/heads/main' }}

      - name: Construir imagen docker
        run: docker build -t msvc-ingrediente .

      - name: Desplegar con Docker Compose
        run: docker compose up -d --build

      - name: Verificar estado del microservicio
        run: |
          for i in {1..10}; do
            if curl -f http://localhost:7073/api/ingredientes; then
              echo "Microservicio funcionando correctamente"
              exit 0
            fi
            echo "Esperando que el microservicio inicie..."
            sleep 5
          done
          echo "El microservicio no respondió correctamente"
          docker compose logs
          exit 1